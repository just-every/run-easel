plugins { id 'com.android.application' }

android {
    namespace 'com.runeditrun.easel'
    compileSdk 34
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.runeditrun.easel'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'com.runeditrun.easel.NativeJourney'
        // Firebase client configuration is public installation metadata, never a service-account key.
        def configFile = file('google-services.json').isFile() ? file('google-services.json') : rootProject.file('google-services.json')
        def firebase = configFile.isFile() ? new groovy.json.JsonSlurper().parse(configFile) : null
        def client = firebase?.client?.find { it.client_info?.android_client_info?.package_name == 'com.runeditrun.easel' }
        def configured = [AppId: client?.client_info?.mobilesdk_app_id, ApiKey: client?.api_key?.getAt(0)?.current_key,
            ProjectId: firebase?.project_info?.project_id, SenderId: firebase?.project_info?.project_number]
        ['AppId', 'ApiKey', 'ProjectId', 'SenderId'].each { field ->
            buildConfigField 'String', 'FIREBASE_' + field.replaceAll(/([a-z])([A-Z])/, '$1_$2').toUpperCase(),
                groovy.json.JsonOutput.toJson(providers.gradleProperty('easelFirebase' + field).getOrElse(configured[field]?.toString() ?: ''))
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}

dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.2' }
