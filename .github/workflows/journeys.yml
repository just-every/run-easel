name: Installation journeys
on:
  schedule:
    - cron: '2 4 * * 1,4'
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      NODE_OPTIONS: ${{ format('--import file://{0}/scripts/ci/playwright-register.mjs?playwright=file://{1}/easel-browser/node_modules/@playwright/test/index.mjs', github.workspace, runner.temp) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Free runner disk for the local servers
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install current browser
        run: |
          npm install --prefix "$RUNNER_TEMP/easel-browser" --no-save @playwright/test@1.64.1
          "$RUNNER_TEMP/easel-browser/node_modules/.bin/playwright" install chromium
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 "$RUNNER_TEMP/easel-browser/node_modules/.bin/playwright" install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
        env:
          EASEL_PLAYWRIGHT_MODULE: ${{ runner.temp }}/easel-browser/node_modules/@playwright/test/index.mjs
      - run: node tests/browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof
      - name: MOBILE-001 phone planning and review
        run: node tests/mobile.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/mobile
      - name: FIN-005 cash constraints at desktop and phone widths
        run: node tests/cash-health-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/cash-health
      - name: CYCLE-005 saved reforecasts and version reports
        run: node tests/reforecasts-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/reforecasts
      - name: CYCLE-006 annual strategy at desktop and phone widths
        run: node tests/long-range-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/long-range
      - name: MOVE-004 parallel month at desktop and phone widths
        run: node tests/parallel-month-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/parallel-month
      - name: CYCLE-002 metric tasks at desktop and phone widths
        run: node tests/metric-tasks-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/metric-tasks
      - name: CYCLE-001 planning calendar at desktop and phone widths
        run: node tests/calendar-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/calendar
      - name: FIN-001 linked statements at desktop and phone widths
        run: node tests/statements-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/statements
      - name: REPORT-005 department statements at desktop and phone widths
        run: node tests/department-statements-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/department-statements
      - name: CYCLE-004 private and shared scenarios at desktop and phone widths
        run: node tests/sandboxes-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/sandboxes
      - name: MODEL-009 actual history and seeded budget grids
        run: node tests/history-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/history
      - name: REPORT-002 saved dashboards at desktop and phone widths
        run: node tests/dashboards-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/dashboards
      - name: REV-003 Gauge operational import and CONNECT-010 custody at desktop and phone widths
        run: node tests/gauge-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/gauge
      - name: REV-003 fixed revenue forms at desktop and phone widths
        run: node tests/revenue-drivers-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/revenue-drivers
      - name: US-001 native defaults, date and currency screens
        run: perl -e 'setpgrp(0,0); exec @ARGV' -- node tests/us-defaults-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/us-defaults
      - name: FIN-002 working capital at desktop and phone widths
        run: perl -e 'setpgrp(0,0); exec @ARGV' -- node tests/working-capital-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/working-capital
      - name: ENTITY-002 reporting currency at desktop and phone widths
        run: node tests/translation-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/translation
      - name: REPORT-006 cash alerts at desktop and phone widths
        run: node tests/cash-alerts-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/cash-alerts
      - name: AGENT-007 confirmed commentary and immutable packs
        run: node tests/variance-commentary-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/variance-commentary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easel-journeys-and-archives
          path: ${{ runner.temp }}/easel-proof

      - name: FIN-007 weekly planned cash at desktop and phone widths
        run: node tests/weekly-cash-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/weekly-cash

      - name: AGENT-004 forecast learning at desktop and phone widths
        run: node tests/forecast-learning-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/forecast-learning

      - name: REPORT-003 quarter board pack at desktop and phone widths
        run: node tests/board-pack-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/board-pack

      - name: REPORT-007 BI dataset, warehouse metrics and drops at desktop and phone widths
        run: node tests/bi-feeds-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/bi-feeds

      - name: AGENT-002 constraint watch and responses at desktop and phone widths
        run: node tests/constraint-responses-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof/constraints
