name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        shard: [types-site, domain, runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: node scripts/edition-authoring/cli.mjs check && pnpm exec rer check
      - name: Types and run site
        if: matrix.shard == 'types-site'
        run: pnpm typecheck && pnpm exec rer build --site
      - name: Domain flows
        if: matrix.shard == 'domain'
        run: pnpm test:easel
      - name: Built runtime
        if: matrix.shard == 'runtime'
        run: pnpm exec rer build && pnpm test:runtime
