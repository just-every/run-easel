name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      # rer's server guard needs 15 GiB free; the hosted runner ships unused toolchains.
      - name: Free runner disk for the local servers
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / /tmp
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec rer verify
      # The run site (run-easel.com): every page builds and every link resolves inside the site.
      - run: pnpm exec rer build --site
      - run: node tests/browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easel-journeys-and-archives
          path: ${{ runner.temp }}/easel-proof
