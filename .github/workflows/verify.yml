name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        shard: [types-site, domain-1, domain-2, runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack install --global pnpm@10.12.4+sha512.5ea8b0deed94ed68691c9bad4c955492705c5eeb8a87ef86bc62c74a26b037b08ff9570f108b2e4dbd1dd1a9186fea925e527f141c648e85af45631074680184
          pnpm install --frozen-lockfile
      - run: node scripts/edition-authoring/cli.mjs check && pnpm exec rer check
      - name: Types and run site
        if: matrix.shard == 'types-site'
        run: pnpm typecheck && pnpm exec rer build --site
      - name: Domain flows (1 of 2)
        if: matrix.shard == 'domain-1'
        run: node --test --test-concurrency=1 --test-shard=1/2 tests/*.test.mjs
      - name: Domain flows (2 of 2)
        if: matrix.shard == 'domain-2'
        run: node --test --test-concurrency=1 --test-shard=2/2 tests/*.test.mjs
      - name: Built runtime
        if: matrix.shard == 'runtime'
        run: pnpm exec rer build && pnpm test:runtime
      - name: CYCLE-007 native department approval chains
        if: matrix.shard == 'runtime'
        run: |
          npm install --prefix "$RUNNER_TEMP/easel-browser" --no-save @playwright/test@1.64.1
          "$RUNNER_TEMP/easel-browser/node_modules/.bin/playwright" install --with-deps chromium
          EASEL_PLAYWRIGHT_MODULE="$RUNNER_TEMP/easel-browser/node_modules/@playwright/test/index.mjs" node tests/approval-chains-browser.mjs
        env:
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-approval-chains
