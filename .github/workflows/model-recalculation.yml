name: Model recalculation journeys
on:
  schedule:
    - cron: '2 4 * * 1,4'
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-recalculation:
    name: MODEL-007 nightly (${{ matrix.journey }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        journey: [scale, background, browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Configure isolated current browser
        if: matrix.journey == 'browser'
        run: |
          {
            printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP"
            printf 'NODE_OPTIONS=--import file://%s/scripts/ci/playwright-register.mjs?playwright=file://%s/easel-browser/node_modules/@playwright/test/index.mjs\n' "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack install --global pnpm@10.12.4+sha512.5ea8b0deed94ed68691c9bad4c955492705c5eeb8a87ef86bc62c74a26b037b08ff9570f108b2e4dbd1dd1a9186fea925e527f141c648e85af45631074680184
          pnpm install --frozen-lockfile
      - name: MODEL-007 measured API scale
        if: matrix.journey == 'scale'
        run: node tests/model-scale.mjs "nightly-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: MODEL-007 bounded background calculation
        if: matrix.journey == 'background'
        run: node tests/calculation-background.mjs
      - name: Install current browser
        if: matrix.journey == 'browser'
        run: |
          npm install --prefix "$RUNNER_TEMP/easel-browser" --no-save @playwright/test@1.64.1
          "$RUNNER_TEMP/easel-browser/node_modules/.bin/playwright" install chromium
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 "$RUNNER_TEMP/easel-browser/node_modules/.bin/playwright" install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
        env:
          EASEL_PLAYWRIGHT_MODULE: ${{ runner.temp }}/easel-browser/node_modules/@playwright/test/index.mjs
      - name: MODEL-007 native calculation at desktop and phone widths
        if: matrix.journey == 'browser'
        run: node tests/calculation-browser.mjs
        env:
          EASEL_PLAYWRIGHT_MODULE: ${{ runner.temp }}/easel-browser/node_modules/@playwright/test/index.mjs
          EASEL_EVIDENCE: ${{ runner.temp }}/easel-model-calculation
      - uses: actions/upload-artifact@v4
        if: always() && matrix.journey == 'browser'
        with:
          name: easel-model-calculation
          path: ${{ runner.temp }}/easel-model-calculation
