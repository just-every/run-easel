name: Run demo
on:
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Deploy a separate demo-test environment with Turnstile test keys'
        type: boolean
        default: false
      remove_test:
        description: 'Remove the separate test demo and read back resource absence (requires test_only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: run-demo-${{ inputs.test_only && 'test' || 'production' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.RUN_DEMO_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: run-demo
    steps:
      - name: Require the test environment for removal
        if: inputs.remove_test
        run: test "$TEST_ONLY" = true
        env:
          TEST_ONLY: ${{ inputs.test_only }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: corepack enable && pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - name: Scope test deployment
        if: inputs.test_only
        run: node --input-type=module -e "import fs from 'node:fs'; const p='deploy-demo.json'; const d=JSON.parse(fs.readFileSync(p)); d.domain='test.run-easel.com'; fs.writeFileSync(p,JSON.stringify(d));"
      # Evidence instrumentation exists only in the disposable test build. It
      # uses the real app session and real global fetch, with no transport fake.
      - name: Instrument the test build for the required app egress proof
        if: inputs.test_only && !inputs.remove_test
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path = 'src/server.ts';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace('authResponse, runtimeBindings', 'authResponse, operatorAuth, runtimeBindings');
          source = source.replace('async fetch(request, env, execution) {', `async fetch(request, env, execution) {
            if (new URL(request.url).pathname === '/__demo/egress-probe') {
              if (!await operatorAuth(runtimeBindings(env)).getSession(request)) return new Response(null, { status: 401 });
              const response = await fetch('https://example.com/');
              const text = await response.text();
              const send = await fetch('https://send.mock-proof.invalid/messages', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ to: 'visitor@example.test', subject: 'Easel demo proof' }) });
              return Response.json({ read: { status: response.status, exampleDomain: text.includes('Example Domain') }, send: { status: send.status, result: await send.json() } });
            }`);
          fs.writeFileSync(path, source);
          JS
      - name: Deploy demo
        if: ${{ !inputs.remove_test }}
        run: pnpm exec rer deploy --demo --environment "$DEMO_ENVIRONMENT"
        env:
          DEMO_ENVIRONMENT: ${{ inputs.test_only && 'demo-test' || 'production' }}
          CLOUDFLARE_ACCOUNT_ID: b20c0ca9cab0c2b70e13d7cf724b89bd
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SITE_KEY: ${{ inputs.test_only && '1x00000000000000000000AA' || vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ inputs.test_only && '1x0000000000000000000000000000000AA' || secrets.TURNSTILE_SECRET_KEY }}
          RER_DEMO_OPERATOR_TOKEN: ${{ secrets.RER_DEMO_OPERATOR_TOKEN }}
      - name: Remove test demo and confirm absence
        if: inputs.remove_test
        env:
          CLOUDFLARE_ACCOUNT_ID: b20c0ca9cab0c2b70e13d7cf724b89bd
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm exec rer deploy --demo --environment demo-test --remove --yes 2>&1 | tee "$RUNNER_TEMP/demo-remove.log"; then
            grep -q 'malformed-response' "$RUNNER_TEMP/demo-remove.log"
            pnpm exec rer deploy --demo --environment demo-test --remove --yes
          fi
          pnpm exec rer deploy --demo --environment demo-test --remove --yes
      - name: Public readback
        if: ${{ !inputs.remove_test }}
        run: |
          domain=demo.$(node -p "require('./deploy-demo.json').domain")
          status=$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 120 --max-time 10 -D "$RUNNER_TEMP/demo-start.headers" -o /dev/null -w '%{http_code}' "https://$domain/")
          test "$status" = 200
          ! grep -qi '^set-cookie:' "$RUNNER_TEMP/demo-start.headers"
